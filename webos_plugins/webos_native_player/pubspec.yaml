name: webos_native_player
description: Plays video on LG webOS TVs by feeding the TV's own decoders (StarfishMediaAPIs buffer feed), with a bundled FFmpeg reading the source.
version: 0.2.0
publish_to: none

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      webos:
        pluginClass: WebosNativePlayerPlugin
